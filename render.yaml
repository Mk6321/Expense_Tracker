# Render blueprint for the FastAPI backend (free tier).
services:
  - type: web
    name: expense-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Supabase POOLED url (pgbouncer, transaction mode, port 6543).
      - key: DATABASE_URL
        sync: false
      # Alembic needs the DIRECT url (port 5432) -- pgbouncer cannot run DDL reliably.
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE
        value: "900"
      - key: JWT_REFRESH_TOKEN_EXPIRE
        value: "1209600"
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: ENVIRONMENT
        value: production
